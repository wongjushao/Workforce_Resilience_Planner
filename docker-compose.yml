services:
  db-setup:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wrp-db-setup
    working_dir: /app/apps/backend
    environment:
      DATABASE_URL: file:/app/data/workforce.db
    volumes:
      - ./:/app
    command: python -m db.migrate

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wrp-backend
    working_dir: /app/apps/backend
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATABASE_URL: file:/app/data/workforce.db
    volumes:
      - ./:/app
    ports:
      - "5000:5000"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: wrp-frontend
    working_dir: /workspace/apps/frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    volumes:
      - ./:/workspace
      - frontend-node-modules:/workspace/apps/frontend/node_modules
    ports:
      - "4200:4200"
    command: >
      sh -c "npm install &&
             npm run start -- --host 0.0.0.0 --port 4200 --disable-host-check"
    depends_on:
      - backend

volumes:
  frontend-node-modules:
