services:
  etl-pipeline:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: wrp-etl-pipeline
    working_dir: /app/scripts
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    command: ["--headless", "--out", "/app/data/src/jobs.json", "--stdout"]

  db-setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wrp-db-setup
    working_dir: /app/apps/backend
    environment:
      DATABASE_URL: file:/app/data/workforce.db
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: llama3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    command: python -m db.ingest --classify

  job-load:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wrp-job-load
    working_dir: /app/apps/backend
    environment:
      DATABASE_URL: file:/app/data/workforce.db
    volumes:
      - ./:/app
    command: python -m db.load_jobs --src /app/data/src/jobs.json
    depends_on:
      db-setup:
        condition: service_completed_successfully
      etl-pipeline:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wrp-backend
    working_dir: /app/apps/backend
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATABASE_URL: file:/app/data/workforce.db
    volumes:
      - ./:/app
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: wrp-frontend
    working_dir: /workspace/apps/frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    volumes:
      - ./:/workspace
      - frontend-node-modules:/workspace/apps/frontend/node_modules
    ports:
      - "4200:4200"
    command: >
      sh -c "npm install &&
             npm run start -- --host 0.0.0.0 --port 4200 --disable-host-check"
    depends_on:
      - backend

volumes:
  frontend-node-modules:
